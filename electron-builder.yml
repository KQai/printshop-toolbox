appId: com.printshop.toolbox
productName: 文印工具箱
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

# sharp 是原生模块，必须解包出 asar 才能加载
asarUnpack:
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'

win:
  target:
    - target: nsis
      arch:
        - x64
  # 必须是纯 ASCII：electron-builder 会把文件名里的非 ASCII 字符直接删掉，
  # 用中文会得到「-0.2.0-.exe」这种坏名字
  artifactName: printshop-toolbox-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 文印工具箱
  language: '2052' # 简体中文
