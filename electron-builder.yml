appId: com.printshop.toolbox
productName: 文印工具箱
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

# sharp 是原生模块，必须解包出 asar 才能加载
asarUnpack:
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-安装包.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 文印工具箱
  language: '2052' # 简体中文
