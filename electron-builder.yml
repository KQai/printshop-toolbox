appId: com.printshop.toolbox
# productName 必须是纯 ASCII：它决定安装目录（%LOCALAPPDATA%\Programs\<productName>）
# 和主程序名（<productName>.exe）。写成中文会让安装路径出现中文，
# 而 Office COM / LibreOffice / sharp 在中文路径下都可能出问题。
productName: PrintshopToolbox
copyright: Copyright (c) 2026

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

# sharp 是原生模块，必须解包出 asar 才能加载
asarUnpack:
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'

win:
  target:
    - target: nsis
      arch:
        - x64
  # 必须是纯 ASCII：electron-builder 会把文件名里的非 ASCII 字符直接删掉，
  # 用中文会得到「-0.2.0-.exe」这种坏名字
  artifactName: printshop-toolbox-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # 快捷方式名只是桌面上显示的「标签」，不是路径，可以放心用中文
  shortcutName: 文印工具箱
  language: '2052' # 简体中文
